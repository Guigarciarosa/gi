# Exemplos de precificação usados em docs/11-precificacao.md (gerado por
# scripts/gerar_exemplos_preco.py) e nos testes. Horas tiradas das tabelas de
# estimativa das skills. `infra` usa a calculadora de custos de cloud.

exemplos:
  - id: transportadora
    titulo: "Transportadora (porte P): custo por km e margem por cliente"
    contexto: "40 caminhões, TOTVS Protheus em SQL Server, rastreador com API e planilha da oficina."
    complexidade: media
    porte: P
    hospedagem: "ZimaOS da consultoria (PostgreSQL + Metabase); infraestrutura dentro da taxa de plataforma"
    valor_anual: 120000
    valor_texto: "2% de economia sobre R$ 6 milhões/ano de custo da frota"
    itens:
      - ["Discovery e mapa de KPIs", 10, negocios]
      - ["Arquitetura e decisão de hospedagem", 6, arquiteto]
      - ["Acesso ao Protheus: usuário de leitura, janela, VPN", 6, dba]
      - ["Fonte Protheus: faturamento e contas a pagar", 40, engenheiro]
      - ["API do rastreador", 12, engenheiro]
      - ["Planilha da oficina com contrato", 6, engenheiro]
      - ["Modelos dbt: viagens, custos, margem", 24, engenheiro]
      - ["Ambiente base: orquestrador, CI, cofre, backup", 16, devops]
      - ["3 painéis e treinamento", 22, analista]
      - ["Controles de acesso e LGPD", 4, cyber]

