                  - {valor: powerbi, rotulo: "Power BI / DAX", sinais: {azure: 1}}
                  - {valor: looker, rotulo: "Looker / Looker Studio", sinais: {gcp: 1}}
                  - {valor: spark, rotulo: "Spark / Databricks"}
                  - {valor: dbt, rotulo: "dbt"}
                  - {valor: airflow, rotulo: "Airflow / orquestração"}
                  - {valor: aws, rotulo: "AWS", sinais: {aws: 1}}
                  - {valor: gcp, rotulo: "GCP", sinais: {gcp: 1}}
                  - {valor: azure, rotulo: "Azure", sinais: {azure: 1}}
                  - {valor: oci, rotulo: "Oracle Cloud", sinais: {oci: 1}}
                  - {valor: linux_docker, rotulo: "Linux / Docker", sinais: {onprem: 1}}
          - {valor: pequeno, rotulo: "Pequeno (2 a 5)", subperguntas: *perfis_time}
          - {valor: estruturado, rotulo: "Estruturado (6+)", subperguntas: *perfis_time}

      - id: mat.ti
        texto: "Como é a TI?"
        tipo: unica
        agentes: [devops, cyber, arquiteto]
        opcoes:
