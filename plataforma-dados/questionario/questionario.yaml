             subperguntas: [{id: mat.ti.fornecedor, texto: "Quem é o fornecedor e qual o escopo?", tipo: texto, agentes: [devops, comercial]}]}
          - {valor: nenhuma, rotulo: "Não há TI", sinais: {onprem: -1}}

      - id: mat.sponsor
        texto: "Há um patrocinador executivo do projeto?"
        tipo: sim_nao
        agentes: [comercial, negocios]
        se_sim:
