          - {valor: hibrido, rotulo: "Híbrido: vocês sustentam, nós evoluímos"}
          - {valor: nao_sei, rotulo: "Ainda não sei"}

      - id: mat.treinamento
        texto: "Precisa de capacitação do time?"
        tipo: multipla
        agentes: [comercial, analista]
        opcoes:
