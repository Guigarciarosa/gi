        se_nao:
          - {id: mat.sponsor.risco, texto: "Quem aprovaria o investimento?", tipo: texto, agentes: [comercial]}

      - id: mat.operacao
        texto: "Depois de implantada, quem opera a plataforma?"
        tipo: unica
