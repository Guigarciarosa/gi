                texto: "Quem vai usar o assistente?"
                tipo: unica
                agentes: [cientista, cyber]
                opcoes:
                  - {valor: interno, rotulo: "Colaboradores"}
                  - {valor: clientes, rotulo: "Clientes (externo)", sinais: {risco: 1}}
          - {valor: agentes, rotulo: "Agentes de IA que executam tarefas", sinais: {ia: 2, automacao: 2}}
