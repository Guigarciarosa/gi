# =============================================================================
#  QUESTIONÁRIO DE DISCOVERY — PLATAFORMA DE DADOS
# =============================================================================
#  Fonte única de verdade do questionário. É lida pelo servidor MCP, pelo app
#  web (questionario.html) e pelos agentes.
#
#  Como funciona a ramificação:
#   - `subperguntas` dentro de uma OPÇÃO: só aparecem quando aquela opção é
#     escolhida (árvore: escolher uma alternativa abre outras).
#   - `mostrar_se` numa PERGUNTA: condição cruzada com qualquer outra resposta,
#     inclusive de outra seção. Formatos aceitos:
#         mostrar_se: {pergunta: infra.atual, em: [on_premise, hibrido]}
#         mostrar_se: {pergunta: dados.volume_total, preenchida: true}
#         mostrar_se: {qualquer: [ {...}, {...} ]}   # OU
#         mostrar_se: {todas:    [ {...}, {...} ]}   # E
#   - `tipo: sim_nao` é um atalho: vira escolha única com as opções sim/não;
#     `se_sim` e `se_nao` são as subperguntas de cada lado.
#
#  Tipos: texto | texto_longo | numero | unica | multipla | escala | sim_nao
#
#  `agentes`: quais agentes consomem a resposta (roteamento de contexto).
#    negocios, arquiteto, engenheiro, analista, cientista, cyber, devops,
#    finops, comercial
#
#  `sinais` (nas opções): pontuações somadas pelo motor de decisão.
#    aws, gcp, azure, oci, onprem  -> afinidade de hospedagem
#    complexidade, risco, ia, automacao, tempo_real -> intensidade
# =============================================================================

meta:
  versao: "1.0.0"
  titulo: "Discovery de Plataforma de Dados"
  descricao: >
    Mapeamento completo do negócio, dos dados, da infraestrutura e dos objetivos
    do cliente. As respostas alimentam os 9 agentes especialistas, que desenham
    a arquitetura, estimam custos nas 4 clouds (AWS, GCP, Azure, OCI) e em
    on-premise, e montam a proposta comercial.
  tempo_estimado_min: 35

secoes:

  # ---------------------------------------------------------------------------
  - id: identificacao
    titulo: "0. Identificação"
    descricao: "Quem é o cliente e quem está respondendo."
    perguntas:
      - id: id.empresa
        texto: "Nome da empresa"
        tipo: texto
        obrigatoria: true
        agentes: [comercial, negocios]
      - id: id.cnpj
        texto: "CNPJ (opcional — usado para enriquecer com dados públicos da Receita)"
        tipo: texto
        agentes: [comercial]
      - id: id.contato_nome
        texto: "Seu nome"
        tipo: texto
        obrigatoria: true
        agentes: [comercial]
      - id: id.contato_cargo
        texto: "Seu cargo / papel na decisão"
        tipo: unica
        agentes: [comercial, negocios]
        opcoes:
          - {valor: socio_ceo, rotulo: "Sócio / CEO / Diretor geral"}
          - {valor: financeiro, rotulo: "CFO / Financeiro / Controladoria"}
          - {valor: ti, rotulo: "CTO / Gerente de TI"}
          - {valor: comercial, rotulo: "Diretor / Gerente comercial"}
          - {valor: operacoes, rotulo: "Operações / Produção / Logística"}
          - {valor: analista, rotulo: "Analista / Coordenador (influenciador)"}
          - {valor: outro, rotulo: "Outro"}
      - id: id.contato_email
        texto: "E-mail"
        tipo: texto
        obrigatoria: true
        agentes: [comercial]
      - id: id.contato_whatsapp
        texto: "WhatsApp"
        tipo: texto
        agentes: [comercial]
      - id: id.cidade_uf
        texto: "Cidade / UF da sede"
        tipo: texto
        agentes: [comercial, arquiteto]
      - id: id.origem
        texto: "Como chegou até nós?"
        tipo: unica
        agentes: [comercial]
        opcoes:
          - {valor: indicacao, rotulo: "Indicação",
             subperguntas: [{id: id.origem.indicacao, texto: "Quem indicou?", tipo: texto, agentes: [comercial]}]}
          - {valor: instagram, rotulo: "Instagram"}
          - {valor: linkedin, rotulo: "LinkedIn"}
          - {valor: google, rotulo: "Google / site"}
          - {valor: evento, rotulo: "Evento / palestra"}
          - {valor: outro, rotulo: "Outro"}

  # ---------------------------------------------------------------------------
  - id: negocio
    titulo: "1. Modelo de Negócio"
    descricao: "Como a empresa funciona, ganha dinheiro e toma decisões."
    perguntas:
      - id: neg.descricao
        texto: "Em poucas linhas: o que a empresa faz e como ganha dinheiro?"
        tipo: texto_longo
        obrigatoria: true
        agentes: [negocios, comercial, arquiteto]

      - id: neg.segmento
        texto: "Qual o segmento principal?"
        tipo: unica
        obrigatoria: true
        agentes: [negocios, arquiteto, cientista, comercial]
        opcoes:
          - valor: varejo
            rotulo: "Varejo / E-commerce"
            subperguntas:
              - id: neg.varejo.canais
                texto: "Quais canais de venda?"
                tipo: multipla
                agentes: [negocios, engenheiro]
                opcoes:
                  - {valor: loja_fisica, rotulo: "Loja física",
                     subperguntas: [{id: neg.varejo.lojas, texto: "Quantas lojas?", tipo: numero, agentes: [negocios, finops]}]}
                  - valor: ecommerce
                    rotulo: "E-commerce próprio"
                    subperguntas:
                      - id: neg.varejo.plataforma_ecom
                        texto: "Plataforma do e-commerce"
                        tipo: unica
                        agentes: [engenheiro]
                        opcoes:
                          - {valor: vtex, rotulo: "VTEX"}
                          - {valor: shopify, rotulo: "Shopify"}
                          - {valor: nuvemshop, rotulo: "Nuvemshop"}
                          - {valor: tray, rotulo: "Tray"}
                          - {valor: woocommerce, rotulo: "WooCommerce"}
                          - {valor: magento, rotulo: "Magento / Adobe Commerce"}
                          - {valor: propria, rotulo: "Plataforma própria"}
                          - {valor: outra, rotulo: "Outra"}
                  - valor: marketplace
                    rotulo: "Marketplaces"
                    subperguntas:
                      - id: neg.varejo.marketplaces
                        texto: "Quais marketplaces?"
                        tipo: multipla
                        agentes: [engenheiro, analista]
                        opcoes:
                          - {valor: mercado_livre, rotulo: "Mercado Livre"}
                          - {valor: amazon, rotulo: "Amazon"}
                          - {valor: shopee, rotulo: "Shopee"}
                          - {valor: magalu, rotulo: "Magalu"}
                          - {valor: americanas, rotulo: "Americanas"}
                          - {valor: tiktok_shop, rotulo: "TikTok Shop"}
                          - {valor: outro, rotulo: "Outro"}
                      - id: neg.varejo.hub
                        texto: "Usa hub de integração (ex.: Bling, Tiny/Olist, ANYMARKET, Plugg.To)?"
                        tipo: texto
                        agentes: [engenheiro]
                  - {valor: whatsapp_social, rotulo: "WhatsApp / social selling"}
                  - {valor: televendas, rotulo: "Televendas / representantes"}
              - id: neg.varejo.skus
                texto: "Quantos SKUs ativos?"
                tipo: unica
                agentes: [engenheiro, cientista]
                opcoes:
                  - {valor: ate_1k, rotulo: "Até 1 mil"}
                  - {valor: 1k_10k, rotulo: "1 mil a 10 mil"}
                  - {valor: 10k_100k, rotulo: "10 mil a 100 mil", sinais: {complexidade: 1}}
                  - {valor: mais_100k, rotulo: "Mais de 100 mil", sinais: {complexidade: 2}}
              - id: neg.varejo.estoque
                texto: "Principal dor com estoque"
                tipo: multipla
                agentes: [negocios, cientista]
                opcoes:
                  - {valor: ruptura, rotulo: "Ruptura (falta produto)", sinais: {ia: 1}}
                  - {valor: excesso, rotulo: "Estoque parado / excesso", sinais: {ia: 1}}
                  - {valor: inventario, rotulo: "Divergência de inventário"}
                  - {valor: nenhuma, rotulo: "Nenhuma relevante"}

          - valor: industria
            rotulo: "Indústria"
            subperguntas:
              - id: neg.ind.tipo
                texto: "Tipo de indústria"
                tipo: unica
                agentes: [negocios, arquiteto]
                opcoes:
                  - {valor: discreta, rotulo: "Manufatura discreta (peças, montagem)"}
                  - {valor: processo, rotulo: "Processo contínuo (química, papel, plástico)"}
                  - {valor: alimentos, rotulo: "Alimentos e bebidas"}
                  - {valor: metal_mecanica, rotulo: "Metal-mecânica"}
                  - {valor: textil, rotulo: "Têxtil / confecção"}
                  - {valor: outra, rotulo: "Outra"}
              - id: neg.ind.chao_fabrica
                texto: "Há coleta automática de dados do chão de fábrica?"
                tipo: sim_nao
                agentes: [engenheiro, arquiteto]
                se_sim:
                  - id: neg.ind.fontes_fabrica
                    texto: "Quais fontes?"
                    tipo: multipla
                    agentes: [engenheiro, arquiteto]
                    opcoes:
                      - {valor: clp, rotulo: "CLP / PLC", sinais: {tempo_real: 1, onprem: 1}}
                      - {valor: scada, rotulo: "SCADA / supervisório", sinais: {tempo_real: 1, onprem: 1}}
                      - {valor: mes, rotulo: "MES"}
                      - {valor: sensores_iot, rotulo: "Sensores IoT", sinais: {tempo_real: 2}}
                      - {valor: apontamento, rotulo: "Apontamento manual em sistema"}
                  - id: neg.ind.protocolo
                    texto: "Protocolo industrial predominante"
                    tipo: unica
                    agentes: [engenheiro]
                    opcoes:
                      - {valor: opcua, rotulo: "OPC-UA"}
                      - {valor: modbus, rotulo: "Modbus"}
                      - {valor: mqtt, rotulo: "MQTT"}
                      - {valor: nao_sei, rotulo: "Não sei"}
                se_nao:
                  - id: neg.ind.apontamento
                    texto: "Como a produção é registrada hoje?"
                    tipo: unica
                    agentes: [negocios, engenheiro]
                    opcoes:
                      - {valor: papel, rotulo: "Papel / planilha", sinais: {automacao: 1}}
                      - {valor: erp, rotulo: "Direto no ERP"}
                      - {valor: nao_registra, rotulo: "Não é registrada"}
              - id: neg.ind.kpis
                texto: "Quais indicadores industriais importam?"
                tipo: multipla
                agentes: [analista, negocios]
                opcoes:
                  - {valor: oee, rotulo: "OEE"}
                  - {valor: refugo, rotulo: "Refugo / retrabalho"}
                  - {valor: custo_produto, rotulo: "Custo por produto"}
                  - {valor: manutencao, rotulo: "MTBF / MTTR (manutenção)", sinais: {ia: 1}}
                  - {valor: sop, rotulo: "S&OP / planejamento de demanda", sinais: {ia: 1}}

          - valor: agro
            rotulo: "Agronegócio"
            subperguntas:
              - id: neg.agro.tipo
                texto: "Atuação no agro"
                tipo: multipla
                agentes: [negocios, arquiteto]
                opcoes:
                  - valor: cooperativa
                    rotulo: "Cooperativa agroindustrial"
                    subperguntas:
                      - {id: neg.agro.coop.cooperados, texto: "Número de cooperados", tipo: numero, agentes: [negocios, finops]}
                      - {id: neg.agro.coop.unidades, texto: "Número de unidades / filiais / entrepostos", tipo: numero, agentes: [arquiteto, finops]}
                  - {valor: produtor, rotulo: "Produtor rural / fazenda"}
                  - {valor: agroindustria, rotulo: "Agroindústria / frigorífico", sinais: {complexidade: 1}}
                  - {valor: revenda_insumos, rotulo: "Revenda de insumos / máquinas"}
                  - {valor: armazenagem, rotulo: "Armazenagem / trading de grãos"}
              - id: neg.agro.dados_campo
                texto: "Dados de campo disponíveis"
                tipo: multipla
                agentes: [engenheiro, cientista]
                opcoes:
                  - {valor: telemetria_maquinas, rotulo: "Telemetria de máquinas (John Deere Ops Center, CNH, AGCO)", sinais: {tempo_real: 1}}
                  - {valor: estacoes_clima, rotulo: "Estações meteorológicas"}
                  - {valor: satelite_drone, rotulo: "Imagens de satélite / drone", sinais: {ia: 2, complexidade: 1}}
                  - {valor: balanca_classificacao, rotulo: "Balança / classificação de grãos"}
                  - {valor: rastreabilidade, rotulo: "Rastreabilidade animal / lote"}
                  - {valor: nenhum, rotulo: "Nenhum estruturado"}
              - id: neg.agro.cotacoes
                texto: "Precisa cruzar com cotações e indicadores externos (CEPEA, B3, CBOT, câmbio)?"
                tipo: sim_nao
                agentes: [engenheiro, cientista]

          - valor: logistica
            rotulo: "Logística / Transporte"
            subperguntas:
              - id: neg.log.modal
                texto: "Modais"
                tipo: multipla
                agentes: [negocios]
                opcoes:
                  - {valor: rodoviario_carga, rotulo: "Rodoviário de carga"}
                  - {valor: passageiros, rotulo: "Transporte de passageiros"}
                  - {valor: last_mile, rotulo: "Last mile / entregas urbanas"}
                  - {valor: armazem, rotulo: "Armazenagem / CD"}
                  - {valor: multimodal, rotulo: "Multimodal"}
              - {id: neg.log.frota, texto: "Tamanho da frota (próprios + agregados)", tipo: numero, agentes: [negocios, engenheiro, finops]}
              - id: neg.log.rastreamento
                texto: "A frota tem rastreamento / telemetria?"
                tipo: sim_nao
                agentes: [engenheiro, arquiteto]
                se_sim:
                  - id: neg.log.rastreador
                    texto: "Provedor de rastreamento"
                    tipo: multipla
                    agentes: [engenheiro]
                    opcoes:
                      - {valor: sascar, rotulo: "Sascar"}
                      - {valor: omnilink, rotulo: "Omnilink"}
                      - {valor: onixsat, rotulo: "Onixsat"}
                      - {valor: autotrac, rotulo: "Autotrac"}
                      - {valor: positron, rotulo: "Pósitron"}
                      - {valor: outro, rotulo: "Outro / próprio"}
                  - id: neg.log.posicoes
                    texto: "Frequência de posição GPS"
                    tipo: unica
                    agentes: [engenheiro, arquiteto]
                    opcoes:
                      - {valor: segundos, rotulo: "A cada poucos segundos", sinais: {tempo_real: 2, complexidade: 1}}
                      - {valor: minuto, rotulo: "A cada 1–5 minutos", sinais: {tempo_real: 1}}
                      - {valor: maior, rotulo: "Mais espaçado"}
              - {id: neg.log.tms, texto: "Sistema TMS / WMS utilizado", tipo: texto, agentes: [engenheiro]}
              - id: neg.log.dores
                texto: "Principais dores"
                tipo: multipla
                agentes: [negocios, cientista]
                opcoes:
                  - {valor: custo_km, rotulo: "Custo por km / por entrega"}
                  - {valor: roteirizacao, rotulo: "Roteirização", sinais: {ia: 1}}
                  - {valor: combustivel, rotulo: "Consumo de combustível / fraude"}
                  - {valor: sla_entrega, rotulo: "SLA de entrega"}
                  - {valor: sinistro_roubo, rotulo: "Sinistro / roubo de carga", sinais: {ia: 1}}

          - valor: seguros_protecao
            rotulo: "Seguros / Proteção veicular"
            subperguntas:
              - id: neg.seg.tipo
                texto: "Tipo de operação"
                tipo: unica
                agentes: [negocios, cyber]
                opcoes:
                  - {valor: seguradora, rotulo: "Seguradora (SUSEP)", sinais: {risco: 1}}
                  - {valor: corretora, rotulo: "Corretora"}
                  - {valor: associacao, rotulo: "Associação de proteção veicular"}
                  - {valor: cooperativa, rotulo: "Cooperativa de proteção"}
                  - {valor: insurtech, rotulo: "Insurtech"}
              - {id: neg.seg.carteira, texto: "Tamanho da carteira (apólices / associados ativos)", tipo: numero, agentes: [negocios, finops, engenheiro]}
              - id: neg.seg.produtos
                texto: "Produtos"
                tipo: multipla
                agentes: [negocios]
                opcoes:
                  - {valor: auto, rotulo: "Auto / moto"}
                  - {valor: caminhao_carga, rotulo: "Caminhão / carga / reboque"}
                  - {valor: vida, rotulo: "Vida"}
                  - {valor: residencial, rotulo: "Residencial / patrimonial"}
                  - {valor: rastreamento, rotulo: "Rastreamento / assistência 24h"}
              - id: neg.seg.dores
                texto: "Principais dores"
                tipo: multipla
                agentes: [negocios, cientista, analista]
                opcoes:
                  - {valor: inadimplencia, rotulo: "Inadimplência", sinais: {ia: 1}}
                  - {valor: sinistralidade, rotulo: "Sinistralidade alta", sinais: {ia: 1}}
                  - {valor: fraude, rotulo: "Fraude em sinistro", sinais: {ia: 2}}
                  - {valor: churn, rotulo: "Cancelamentos / churn", sinais: {ia: 1}}
                  - {valor: precificacao, rotulo: "Precificação (FIPE, perfil de risco)", sinais: {ia: 1}}
                  - {valor: regulatorio, rotulo: "Relatórios regulatórios", sinais: {risco: 1}}
              - id: neg.seg.fipe
                texto: "Usa tabela FIPE ou bases externas de veículos na precificação?"
                tipo: sim_nao
                agentes: [engenheiro, cientista]

          - valor: financeiro
            rotulo: "Serviços financeiros"
            subperguntas:
              - id: neg.fin.tipo
                texto: "Tipo"
                tipo: unica
                agentes: [negocios, cyber]
                opcoes:
                  - {valor: banco_fintech, rotulo: "Banco / fintech", sinais: {risco: 2}}
                  - {valor: coop_credito, rotulo: "Cooperativa de crédito", sinais: {risco: 2}}
                  - {valor: fidc_factoring, rotulo: "FIDC / factoring / securitizadora", sinais: {risco: 1}}
                  - {valor: pagamentos, rotulo: "Meios de pagamento", sinais: {risco: 2, tempo_real: 1}}
                  - {valor: contabil_bpo, rotulo: "Contabilidade / BPO financeiro"}
              - id: neg.fin.bacen
                texto: "É regulada pelo Banco Central (Res. CMN 4.893 / BCB 85 — segurança cibernética e nuvem)?"
                tipo: sim_nao
                agentes: [cyber, arquiteto, devops]
                se_sim:
                  - {id: neg.fin.bacen.comunicacao, texto: "Já comunicou ao BACEN a contratação de serviços de nuvem relevantes?", tipo: sim_nao, agentes: [cyber]}
              - id: neg.fin.casos
                texto: "Casos de uso prioritários"
                tipo: multipla
                agentes: [cientista, negocios]
                opcoes:
                  - {valor: score_credito, rotulo: "Score de crédito", sinais: {ia: 2}}
                  - {valor: pld_aml, rotulo: "PLD / AML", sinais: {ia: 1, risco: 1}}
                  - {valor: fraude, rotulo: "Detecção de fraude", sinais: {ia: 2, tempo_real: 1}}
                  - {valor: cobranca, rotulo: "Régua de cobrança", sinais: {automacao: 1}}
                  - {valor: open_finance, rotulo: "Open Finance"}

          - valor: saude
            rotulo: "Saúde"
            subperguntas:
              - id: neg.saude.tipo
                texto: "Tipo"
                tipo: unica
                agentes: [negocios, cyber]
                opcoes:
                  - {valor: clinica, rotulo: "Clínica / consultório"}
                  - {valor: hospital, rotulo: "Hospital", sinais: {complexidade: 1}}
                  - {valor: laboratorio, rotulo: "Laboratório / imagem"}
                  - {valor: operadora, rotulo: "Operadora de plano (ANS)", sinais: {risco: 1}}
                  - {valor: farmacia, rotulo: "Farmácia / distribuidora"}
                  - {valor: healthtech, rotulo: "Healthtech"}
              - {id: neg.saude.sistemas, texto: "Sistemas de gestão (ex.: Tasy, MV, Soul, iClinic, próprio)", tipo: texto, agentes: [engenheiro]}
              - id: neg.saude.prontuario
                texto: "A plataforma vai tocar dados de prontuário / clínicos?"
                tipo: sim_nao
                agentes: [cyber, arquiteto]
                se_sim:
                  - id: neg.saude.prontuario.aviso
                    texto: "Dados de saúde são sensíveis (LGPD art. 11). Há base legal e consentimento mapeados?"
                    tipo: unica
                    agentes: [cyber]
                    opcoes:
                      - {valor: sim, rotulo: "Sim, mapeado pelo DPO"}
                      - {valor: parcial, rotulo: "Parcialmente", sinais: {risco: 1}}
                      - {valor: nao, rotulo: "Não", sinais: {risco: 2}}

          - valor: educacao
            rotulo: "Educação"
            subperguntas:
              - id: neg.edu.tipo
                texto: "Tipo"
                tipo: unica
                agentes: [negocios]
                opcoes:
                  - {valor: escola, rotulo: "Escola (básico)", sinais: {risco: 1}}
                  - {valor: superior, rotulo: "Ensino superior"}
                  - {valor: edtech, rotulo: "Edtech / cursos online"}
                  - {valor: livres, rotulo: "Cursos livres / idiomas"}
              - {id: neg.edu.alunos, texto: "Número de alunos ativos", tipo: numero, agentes: [negocios, finops]}
              - {id: neg.edu.lms, texto: "Plataforma acadêmica / LMS (ex.: TOTVS RM, Moodle, Canvas, Hotmart, própria)", tipo: texto, agentes: [engenheiro]}
              - id: neg.edu.dores
                texto: "Dores"
                tipo: multipla
                agentes: [negocios, cientista]
                opcoes:
                  - {valor: evasao, rotulo: "Evasão", sinais: {ia: 1}}
                  - {valor: captacao, rotulo: "Captação / funil de matrícula"}
                  - {valor: inadimplencia, rotulo: "Inadimplência", sinais: {ia: 1}}
                  - {valor: desempenho, rotulo: "Desempenho acadêmico"}

          - valor: saas_tecnologia
            rotulo: "SaaS / Tecnologia"
            subperguntas:
              - id: neg.saas.modelo
                texto: "Modelo"
                tipo: unica
                agentes: [negocios, arquiteto]
                opcoes:
                  - {valor: saas_b2b, rotulo: "SaaS B2B"}
                  - {valor: app_b2c, rotulo: "App B2C", sinais: {complexidade: 1}}
                  - {valor: software_house, rotulo: "Software house / fábrica"}
                  - {valor: provedor_internet, rotulo: "Provedor de internet (ISP)"}
              - id: neg.saas.metricas
                texto: "Métricas de produto já medidas"
                tipo: multipla
                agentes: [analista, negocios]
                opcoes:
                  - {valor: mrr, rotulo: "MRR / ARR"}
                  - {valor: churn, rotulo: "Churn / NRR"}
                  - {valor: cac_ltv, rotulo: "CAC / LTV"}
                  - {valor: uso, rotulo: "Uso do produto (DAU/MAU, eventos)", sinais: {complexidade: 1}}
                  - {valor: nenhuma, rotulo: "Nenhuma"}
