                  - {valor: gcp, rotulo: "Google Cloud", sinais: {gcp: 2}}
                  - {valor: azure, rotulo: "Azure", sinais: {azure: 2}}
                  - {valor: oci, rotulo: "Oracle Cloud", sinais: {oci: 2}}
